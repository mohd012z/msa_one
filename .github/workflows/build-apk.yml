name: Build MSA One APK
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/create-studio-plan-complete ]
    paths: ['www/**','tests/**','scripts/**','package.json','capacitor.config.json','.github/workflows/build-apk.yml']
jobs:
  build:
    name: Agent Sahab Bot — Inspect, Build, Approve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Setup Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Package Calendar adaptive UI and Create Studio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html'); s=p.read_text()
          s=s.replace('width=device-width,initial-scale=1,viewport-fit=cover','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover')
          css='\n'.join(Path(x).read_text() for x in ['www/theme-v2.css','www/create-studio.css','www/files-workspace.css','www/planner.css'])
          s=s.replace('</head>',f'<style>{css}</style></head>')
          home='<div class="build-id" data-build-id="MSA-ONE-37">MSA One 37 · AUTO DISPLAY FIT</div><button class="planner-home" data-planner-open data-calendar-home onclick="window.MSAPlanner&&MSAPlanner.open()"><span>📅</span><div><b>Calendar & Daily Planner</b><small>Diary · programs · plans · notes</small></div><strong>›</strong></button>'
          marker='</p></section><div class="cap">QUICK START</div>'
          if marker not in s: raise SystemExit('Home injection marker missing')
          s=s.replace(marker,'</p></section>'+home+'<div class="cap">QUICK START</div>',1)
          me='<button class="planner-home" data-calendar-me onclick="window.MSAPlanner&&MSAPlanner.open()"><span>📅</span><div><b>Calendar & Daily Planner</b><small>Diary · daily program · plans · notes</small></div><strong>›</strong></button><div class="build-id" data-build-id="MSA-ONE-37">MSA One 37 · AUTO DISPLAY FIT</div>'
          m='<div class="cap">MY WORKSPACE</div>'; start=s.find('id="me"'); pos=s.find(m,start)
          if start < 0 or pos < 0: raise SystemExit('Me injection marker missing')
          pos+=len(m); s=s[:pos]+me+s[pos:]
          for x in ['www/project-store.js','www/planner.js','www/settings-v2.js','www/create-studio.js','www/files-workspace.js']:
              s=s.replace('</body>','<script>'+Path(x).read_text()+'</script></body>')
          p.write_text(s)
          PY
      - name: Agent Sahab — regression contracts
        run: |
          for test in tests/*.test.mjs; do
            case "$test" in tests/calendar-visibility.test.mjs) continue ;; esac
            echo "Agent Sahab checking $test"; node "$test"
          done
      - name: Agent Sahab — source bot
        run: node scripts/agent-sahab-source-audit.mjs
      - name: Verify packaged modules
        run: |
          grep -q 'data-calendar-home' www/index.html
          grep -q 'MSA-ONE-37' www/index.html
          grep -q -- '--msa-screen-width' www/index.html
          grep -q 'visualViewport' www/index.html
          grep -q 'MSAProjectStore' www/index.html
          grep -q 'renderSheet' www/index.html
          grep -q 'renderSlides' www/index.html
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Set Android Build 37 version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle'); s=p.read_text().replace('versionCode 1','versionCode 37').replace('versionName "1.0"','versionName "37.0"'); p.write_text(s)
          PY
      - name: Verify Android assets
        run: |
          grep -q 'com.msa.one.displayfit37' android/app/build.gradle
          grep -q 'versionCode 37' android/app/build.gradle
          grep -q 'MSAProjectStore' android/app/src/main/assets/public/index.html
          grep -q 'renderSheet' android/app/src/main/assets/public/index.html
          grep -q 'renderSlides' android/app/src/main/assets/public/index.html
          grep -q 'data-calendar-home' android/app/src/main/assets/public/index.html
      - name: Agent Sahab — Android lint
        working-directory: android
        run: ./gradlew lintDebug
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Agent Sahab — APK inspector
        run: bash scripts/agent-sahab-audit.sh
      - name: Agent Sahab — final verdict
        run: node scripts/agent-sahab-verdict.mjs
      - name: Upload Agent Sahab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Sahab-Audit-Report
          path: |
            agent-sahab-source.json
            agent-sahab-source.md
            agent-sahab-report.md
            agent-sahab-badging.txt
            agent-sahab-verdict.json
            agent-sahab-verdict.md
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Publish Agent Sahab APPROVED APK
        uses: actions/upload-artifact@v4
        with:
          name: MSA-One-37-AGENT-SAHAB-APPROVED-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error