name: Build MSA One APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'tests/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Test source contracts
        run: npm test

      - name: Verify MSA One 38 source UI
        run: |
          grep -q 'data-build-id="MSA-ONE-38"' www/index.html
          grep -q 'data-calendar-home' www/index.html
          grep -q 'data-calendar-me' www/index.html
          grep -q 'theme-v2.css' www/index.html
          grep -q 'planner.js' www/index.html
          grep -q 'app-actions.js' www/index.html
          grep -q -- '--msa-screen-width' www/theme-v2.css
          grep -q 'screen.width' www/settings-v2.js
          grep -q 'visualViewport' www/settings-v2.js

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Set Android Build 38 version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 1','versionCode 38')
          s=s.replace('versionName "1.0"','versionName "38.0"')
          p.write_text(s)
          PY

      - name: Verify Android package and assets
        run: |
          grep -q 'com.msa.one.displayfit37' android/app/build.gradle
          grep -q 'versionCode 38' android/app/build.gradle
          grep -q 'data-build-id="MSA-ONE-38"' android/app/src/main/assets/public/index.html
          grep -q 'data-calendar-home' android/app/src/main/assets/public/index.html
          grep -q 'data-calendar-me' android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/theme-v2.css
          test -f android/app/src/main/assets/public/planner.js
          test -f android/app/src/main/assets/public/app-actions.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSA-One-38-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
