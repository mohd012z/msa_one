name: Build MSA One APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['www/**','tests/**','package.json','capacitor.config.json','.github/workflows/build-apk.yml','premium-prep/**','security-prep/**','native-prep/**','scripts/**']
  pull_request:
    branches: [ main ]
    paths: ['www/**','tests/**','package.json','capacitor.config.json','.github/workflows/build-apk.yml','premium-prep/**','security-prep/**','native-prep/**','scripts/**']

concurrency:
  group: msa-one-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Test source contracts
        run: npm test

      - name: Verify MSA One 55 source UI
        run: |
          grep -q "version:'55.0.0'" www/app-manifest.js
          grep -q "buildId:'MSA-ONE-55'" www/app-manifest.js
          grep -q 'MSA-ONE-55' www/app-shell.js
          grep -q -- '--msa-touch-min:48px' www/ui-system.css
          grep -q 'MIN_TOUCH_TARGET=48' www/mobile-quality.js
          grep -q 'MSAIcons' www/icon-system.js
          grep -q 'MSAActionHub' www/action-hub.js
          grep -q 'MSALibraryShell' www/library-shell-adapter.js
          grep -q 'MSAAppShell' www/app-shell.js
          grep -q 'MSASearchCenter' www/search-center.js
          grep -q 'MSAToolsCenter' www/tools-center.js
          grep -q 'MSAAIWorkspace' www/ai-tools.js
          grep -q 'todaySummary' www/planner.js
          grep -q 'bindSheetDrag' www/office-mobile.js
          grep -q 'MSAOfficeMobile' www/office-mobile.js
          grep -q 'builtInOCR:false' www/pdf-readiness.js
          grep -q 'Content-Security-Policy' www/index.html
          grep -q "object-src 'none'" www/index.html
          grep -q "base-uri 'none'" www/index.html
          grep -q 'active:false' www/premium-config.js
          grep -q 'enforce:true' www/premium-config.js
          grep -q "libraryVersion:'9.1.0'" www/premium-config.js
          grep -q 'ACTIVE = false' premium-prep/android/PremiumBillingPlugin.java
          test -f native-prep/android/MSAFileBridgePlugin.java
          test -f native-prep/android/MSAPdfViewerActivity.java
          grep -q 'ACTION_OPEN_DOCUMENT_TREE' native-prep/android/MSAFileBridgePlugin.java
          grep -q 'takePersistableUriPermission' native-prep/android/MSAFileBridgePlugin.java
          grep -q 'MediaStore.Downloads' native-prep/android/MSAFileBridgePlugin.java
          grep -q 'openPdfViewer' native-prep/android/MSAFileBridgePlugin.java
          grep -q 'PdfRenderer' native-prep/android/MSAPdfViewerActivity.java
          test -f scripts/apply-android-security.mjs
          test -f security-prep/android/network_security_config.xml

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Apply Android security hardening
        run: node scripts/apply-android-security.mjs

      - name: Set Android Build 55 version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 1','versionCode 55')
          s=s.replace('versionName "1.0"','versionName "55.0"')
          p.write_text(s)
          PY

      - name: Verify Android package and assets
        run: |
          grep -q 'com.msa.one.displayfit37' android/app/build.gradle
          grep -q 'versionCode 55' android/app/build.gradle
          grep -q 'versionName "55.0"' android/app/build.gradle
          grep -q 'MSA-ONE-55' android/app/src/main/assets/public/app-shell.js
          for f in ui-system.css icon-system.js action-hub.js library-shell-adapter.js app-manifest.js workspace-v2.css app-shell.js search-center.js home-v2.js files-v2.js tools-center.js ai-tools.js create-v2.js planner.js office-mobile.js office-mobile.css mobile-quality.js security-engine.js native-file-bridge.js core-library.js library-engine.js storage-engine.js office-engine.js import-engine.js formula-engine.js editor-history.js editor-adapter.js; do
            test -f "android/app/src/main/assets/public/$f"
          done
          test -f android/app/src/main/java/com/msa/one/displayfit37/MSAFileBridgePlugin.java
          test -f android/app/src/main/java/com/msa/one/displayfit37/MSAPdfViewerActivity.java
          grep -q 'registerPlugin(MSAFileBridgePlugin.class)' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          grep -q 'applySystemBarInsets' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          grep -q -- '--native-safe-top' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          grep -q 'ACTION_OPEN_DOCUMENT_TREE' android/app/src/main/java/com/msa/one/displayfit37/MSAFileBridgePlugin.java
          grep -q 'MediaStore.Downloads' android/app/src/main/java/com/msa/one/displayfit37/MSAFileBridgePlugin.java
          grep -q 'PdfRenderer' android/app/src/main/java/com/msa/one/displayfit37/MSAPdfViewerActivity.java
          grep -q 'MSAPdfViewerActivity' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/xml/network_security_config.xml
          grep -q 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
          grep -q 'setAllowFileAccess(false)' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          grep -q 'setAllowFileAccessFromFileURLs(false)' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          grep -q 'setAllowUniversalAccessFromFileURLs(false)' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          grep -q 'setSafeBrowsingEnabled(true)' android/app/src/main/java/com/msa/one/displayfit37/MainActivity.java
          ! grep -q 'com.android.billingclient:billing' android/app/build.gradle
          test ! -f android/app/src/main/java/com/msa/one/displayfit37/PremiumBillingPlugin.java

      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSA-One-55-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
